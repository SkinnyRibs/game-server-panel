name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: PLAYWRIGHT_BROWSERS_PATH="$HOME/.cache/ms-playwright" python -m pytest -q
      - run: node --check static/app.js && node --check static/files.js && node --check static/services.js
